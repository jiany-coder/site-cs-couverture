name: Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: /site-cs-couverture
      REACT_APP_SITE_URL: https://jiany-coder.github.io/site-cs-couverture
      SITE_URL: https://jiany-coder.github.io/site-cs-couverture
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build:static
      - name: Préversion non indexée
        run: |
          printf 'User-agent: *\nDisallow: /\n' > build/robots.txt
          rm -f build/sitemap.xml
          touch build/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          publish_branch: gh-pages
          force_orphan: true
